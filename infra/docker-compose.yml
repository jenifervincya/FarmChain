# FairChain local dev orchestration.
# Owned by Archana (Frontend/DevOps) per Section 3.3 of the spec.
#
# STATUS: skeleton. The `frontend` service is real and buildable today.
# `backend` and `ai-service` are stubbed with placeholder build contexts —
# swap in Jenifer's and Anisha's Dockerfiles as they land (Section 5,
# Phase 4). Kafka/Postgres/Schema Registry images are standard and can be
# used as-is; Backend still owns topic/schema creation (Section 2.1).

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairchain
      POSTGRES_USER: fairchain
      POSTGRES_PASSWORD: fairchain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"

  # --- Placeholder until Jenifer supplies backend/Dockerfile ---
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - kafka
      - schema-registry
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fairchain
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

  # --- Placeholder until Anisha supplies ai-service/Dockerfile ---
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    depends_on:
      - kafka
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
