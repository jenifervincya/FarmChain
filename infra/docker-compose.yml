# Minimal local dev stack for testing backend services.
# NOT the final docker-compose.yml — that's Archana's ownership per
# Section 3.3/8.1 (infra/ is her domain). This is scoped just to
# Postgres + Kafka so Jenifer can test her services locally before
# the full orchestration (all services + Frontend) is built.

version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: fairchain-postgres
    environment:
      POSTGRES_DB: fairchain
      POSTGRES_USER: fairchain
      POSTGRES_PASSWORD: fairchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fairchain-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fairchain-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  postgres_data:
