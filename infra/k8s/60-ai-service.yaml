# PLACEHOLDER: same as backend — swap the image once ai-service/Dockerfile exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: fairchain
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-service }
  template:
    metadata:
      labels: { app: ai-service }
    spec:
      containers:
        - name: ai-service
          image: fairchain/ai-service:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: fairchain
spec:
  selector: { app: ai-service }
  ports:
    - port: 8000
      targetPort: 8000
