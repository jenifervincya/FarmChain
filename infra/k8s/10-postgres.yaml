apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fairchain
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: fairchain
            - name: POSTGRES_USER
              value: fairchain
            - name: POSTGRES_PASSWORD
              value: fairchain
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        # emptyDir for demo simplicity — not durable across pod restarts.
        # Swap for a PersistentVolumeClaim before this needs to survive a demo day.
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fairchain
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
