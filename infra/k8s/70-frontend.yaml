# Build first: docker build -t fairchain/frontend:latest ./frontend
# Then load into your cluster (kind load docker-image / minikube image load)
# before applying this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fairchain
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: fairchain/frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fairchain
spec:
  selector: { app: frontend }
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
