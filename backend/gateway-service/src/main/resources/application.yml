server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: batch-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/batches/**

        - id: auction-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auctions/**

        - id: reputation-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/reputation/**

        - id: price-journey-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/price-journey/**

        - id: events-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/events/**

  # Eureka client dependency is in pom.xml but not required to run —
  # disabled for now since we're using static routes above.
  cloud.discovery.enabled: false

eureka:
  client:
    enabled: false
