server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: batch-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/batches/**

        - id: farmer-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/farmers/**

        - id: auction-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auctions/**

        - id: reputation-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/reputation/**

        - id: price-journey-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/price-journey/**

        - id: events-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/events/**

        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/notifications/**

        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - StripPrefix=2

  cloud.discovery.enabled: false

eureka:
  client:
    enabled: false
